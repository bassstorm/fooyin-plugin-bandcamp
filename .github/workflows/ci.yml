name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Fooyin
        run: sudo bash .devcontainer/features/fooyin/install.sh

      - name: Build plugin
        run: |
          cmake --preset dev
          cmake --build --preset dev

      - name: Build tests
        run: |
          cmake --preset tests-sanitize
          cmake --build --preset tests-sanitize

      - name: Run tests
        run: ctest --preset tests-ci
