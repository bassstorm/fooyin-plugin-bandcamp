name: Release

# Started manually from the Actions tab. The version comes from project(VERSION)
# in CMakeLists.txt; this workflow tags that commit as v<version>, publishes it,
# and then bumps the patch version on the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-branch:
    name: Check branch
    runs-on: ubuntu-26.04
    steps:
      - name: Require default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Releases are cut from ${{ github.event.repository.default_branch }}, not ${GITHUB_REF_NAME}"
          exit 1

  build:
    needs: check-branch
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: read
    with:
      preset: release

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # Starts CI for the version-bump commit.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}

    steps:
      - name: Require unreleased version
        run: |
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists. Bump project(VERSION) in CMakeLists.txt first."
            exit 1
          fi

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Create release
        run: |
          previous="$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // empty')"
          gh release create "$TAG" dist/*.fyplugin \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"} \
            --latest

      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Start next patch version
        env:
          RELEASED: ${{ needs.build.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          IFS=. read -r major minor patch <<< "$RELEASED"
          next="${major}.${minor}.$((patch + 1))"
          sed -i -E "s/^([[:space:]]*VERSION )${RELEASED//./\\.}$/\1${next}/" CMakeLists.txt
          if [ "$(git diff --numstat)" != "$(printf '1\t1\tCMakeLists.txt')" ]; then
            echo "::error::${TAG} is published, but project(VERSION ${RELEASED}) was not found on ${BRANCH}. Bump it manually."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Start ${next} development"
          git push origin "HEAD:${BRANCH}"
          gh workflow run ci.yml --ref "$BRANCH"
